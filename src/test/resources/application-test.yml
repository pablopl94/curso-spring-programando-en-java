spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        default_schema: ecommerce
        generate_statistics: true
        format_sql: true
        hbm2ddl:
          create_namespaces: true

  flyway:
    enabled: false

  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: ${JWT_SECRET} # secret-key la usará Spring automáticamente para validar los tokens
          expiration: ${JWT_EXPIRATION} # Tiempo de vida del token (en milisegundos)

# Configuración personalizada para modo dev
app:
  payment-provider: mock # Indica la pasarela de pago que vamos a usar, en dev usaremos un mock de la pasarela
  jwt:
    issuer-url: https://programandoenjava.com # URL del emisor del token


