spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # Configuración de Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Configuración JPA específica de prod
  jpa:
    show-sql: false
    properties:
      hibernate:
        default_schema: ecommerce
        generate_statistics: false
        format_sql: false

  # Configuración JWT para OAuth2 Resource Server
  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: ${JWT_SECRET}

# Puerto en prod
server:
  port: 443

# Configuración personalizada para modo prod
app:
  payment-provider: ${PAYMENT_PROVIDER}
  stripe-key: ${STRIPE_API_KEY}
  paypal-key: ${PAYPAL_API_KEY}

# Logging en modo INFO
logging:
  level:
    com.programandoenjava.bootcamp_1_2026: INFO