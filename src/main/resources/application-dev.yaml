spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # Configuración de Flyway
  flyway:
    enabled: true # Activa el control automático de versiones de la BD con FlyWay en este caso
    locations: classpath:db/migration # Ruta donde Flyway va a buscar los scripts
    baseline-on-migrate: true # Permite empezar a usar Flyway en una BD que ya existe

  # Configuración JPA específica de dev
  jpa:
    show-sql: true # Muestra el SQL en consola
    properties:
      hibernate:
        default_schema: ecommerce # Indica en qué esquema de Postgres trabajar por defecto
        generate_statistics: true # Muestra métricas (tiempo y cantidad de queries) al final
        format_sql: true # Deja el SQL por consola bonito para que sea fácil de leer

  # Configuración JWT para OAuth2 Resource Server
  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: ${JWT_SECRET} # secret-key la usará Spring automáticamente para validar los tokens
          expiration: ${JWT_EXPIRATION} # Tiempo de vida del token (en milisegundos)

# Configuración personalizada para modo dev
app:
  payment-provider: mock # Indica la pasarela de pago que vamos a usar, en dev usaremos un mock de la pasarela
  jwt:
    issuer-url: https://programandoenjava.com # URL del emisor del token


# Puerto para dev
server:
  port: 8081

# Logging en modo DEBUG para dev
logging:
  level:
    com.programandoenjava.bootcamp_1_2026: DEBUG