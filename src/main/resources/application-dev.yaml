spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce_db
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver

  # Configuración de Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Configuración JPA específica de dev
  jpa:
    show-sql: true
    properties:
      hibernate:
        default_schema: ecommerce
        generate_statistics: true
        format_sql: true

  # Configuración JWT para OAuth2 Resource Server
  # secret-key la usará Spring automáticamente para validar los tokens
  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: 7e40f4ca906d42b63d599c1bf7c0d5cc43f9e7923f7ef25663740f6061a2482a
          expiration: 86400000
          refresh-token-expiration: 604800000

app:
  jwt:
    issuer-url: https://programandoenjava.com

# Puerto
server:
  port: 8081

# Logging en modo DEBUG
logging:
  level:
    com.programandoenjava.bootcamp_1_2026: DEBUG