name: testci

on:
  push:
    branches: [ main ]

jobs:
  integration-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: ecommerce_db
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Test de integración
        run: mvn clean verify -DskipUnitTests

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Test unitarios
        run: mvn clean test

  build:
    runs-on: ubuntu-latest
    needs: [ integration-test,unit-test ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Run build application
        run: mvn clean package -DskipUnitTests

      - name: Subir el JAR
        uses: actions/upload-artifact@v4
        with:
          name: jar-file
          path: target/*.jar

  deploy:
    name: Simulando despliegue en Heroku
    runs-on: ubuntu-latest
    needs: [ integration-test,unit-test, build ]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Descargar JAR
        uses: actions/download-artifact@v4
        with:
          name: jar-file

      - name: Simulando despliegue en Heroku
        run: |
          echo "Despliegue en Heroku..."
          echo "Aplicación desplegada correctamente"